<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestenlerner – Prototyp</title>
<style>
:root{--bg:#eef1f6;--ink:#1b2240;--ac:#6b2a5c;--ok:#4f8a5b;--bad:#b8412f;--card:#fff;--line:#cfd5e3;--mute:#646c88}
@media(prefers-color-scheme:dark){:root{--bg:#161a2e;--ink:#e8eaf4;--ac:#c58ab8;--card:#22274a;--line:#3a4170;--mute:#9aa2c4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 ui-rounded,"Avenir Next",system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:14px 16px 24px}
.la{font-family:"Iowan Old Style",Palatino,Georgia,serif}
header{display:flex;gap:8px;align-items:center}
header button{border:0;border-radius:99px;background:var(--card);color:var(--ink);padding:8px 14px;font:inherit;cursor:pointer}
#bar{flex:1;height:10px;border-radius:9px;background:var(--line);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
#prompt{margin:16px 0 10px;color:var(--mute)}
.card{background:var(--card);border-radius:20px;padding:22px 16px;text-align:center;box-shadow:0 2px 0 var(--line)}
.card b{display:block;font-size:30px;font-weight:600}
.card small{color:var(--mute)}
.pad{width:100%;max-width:340px;margin:18px auto 0;display:block;touch-action:none;background:var(--card);border-radius:20px}
.opts{display:grid;gap:10px;margin-top:22px}
.opt,.tile,.res button,.go{border:0;border-radius:16px;background:var(--card);color:var(--ink);font:inherit;font-size:20px;padding:16px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.go{background:var(--ac);color:#fff;box-shadow:none;margin-top:18px}
.ok{background:var(--ok)!important;color:#fff}.bad{background:var(--bad)!important;color:#fff}
.tip{outline:3px solid var(--ac)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.cols>div{display:grid;gap:10px;align-content:start}
.sel{outline:3px solid var(--ac)}.gone{visibility:hidden}
.ans{min-height:2.2em;margin-top:14px;font-size:26px;text-align:center;letter-spacing:.06em;border-bottom:2px solid var(--line);padding-bottom:10px}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:30px;justify-content:center}
.tile{min-width:56px;padding:14px 12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:22px;touch-action:none;user-select:none}
.grid div{aspect-ratio:1;display:grid;place-items:center;background:var(--card);border-radius:14px;font-size:24px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.grid .on{background:var(--ac);color:#fff}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}#bar i{transition:none}}
.res ul{padding:0;list-style:none}.res li{padding:8px 0;border-bottom:1px solid var(--line)}
button:focus-visible{outline:3px solid var(--ac)}
</style></head>
<body><div id="app">
<header id="hd" hidden><button id="x" aria-label="Beenden">✕</button><div id="bar"><i></i></div><button id="tipb" hidden>Tipp</button></header>
<p id="prompt"></p><main id="stage" style="display:flex;flex-direction:column;flex:1"></main>
</div>
<script>
// ---------- Daten (siehe DATENMODELL.md) ----------
const W=[
{la:"et",de:"und",ch:["et"],g:[[20,50],[80,50],[50,50],[50,20],[50,80]]},
{la:"vulpēs",de:"der Fuchs",ch:["vul","pēs"],g:[[20,80],[30,20],[50,50],[70,20],[80,80]]},
{la:"vīcus",de:"das Dorf",ch:["vī","cus"],g:[[20,80],[20,50],[50,20],[80,50],[80,80],[20,80]]},
{la:"perīculum",de:"die Gefahr",ch:["perī","cu","lum"],g:[[60,10],[35,50],[65,50],[40,90]]},
{la:"errāre",de:"sich verirren",ch:["er","rā","re"],g:[[10,50],[30,20],[50,70],[70,30],[90,60]]},
{la:"adhortārī",de:"motivieren",ch:["adh","ort","ārī"],g:[[20,50],[80,50],[60,30],[80,50],[60,70]]}];
const IDX=W.map((_,k)=>k), FILL=Array.from("abcdefghilmnopqrstuvāēīōū");
// ---------- Helfer ----------
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const stage=document.getElementById('stage'),P=document.getElementById('prompt'),hd=document.getElementById('hd'),bar=document.querySelector('#bar i'),tipb=document.getElementById('tipb');
const wobble=e=>{e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')};
let S,hint=null;
// ---------- Ablauf ----------
function home(){hd.hidden=true;P.textContent='';stage.replaceChildren();
 const c=$('div','card');c.append($('b','la','Gestenlerner'),$('small',0,'Prototyp: 6 Latein-Vokabeln, 5 Übungstypen'));
 const g=$('button','go','Starten');g.onclick=start;stage.append(c,g)}
function start(){const q=[];
 IDX.forEach(k=>q.push({t:gest,k}));
 sh(IDX).forEach(k=>q.push({t:mc,k}));
 q.push({t:pairs});
 sh(IDX).filter(k=>W[k].ch.length>1).forEach(k=>q.push({t:spell,m:1,k}));
 sh(IDX).forEach(k=>q.push({t:spell,m:0,k}));
 sh(IDX).forEach(k=>q.push({t:grid,k}));
 S={q,i:0,err:0,errW:W.map(()=>0)};hd.hidden=false;show()}
function show(){hint=null;tipb.hidden=true;bar.style.width=S.i/S.q.length*100+'%';stage.replaceChildren();const T=S.q[S.i];T.t(T)}
function ok(ms=500){setTimeout(()=>{S.i++;S.i>=S.q.length?done():show()},ms)}
function bad(k){S.err++;if(k!=null)S.errW[k]++}
function setHint(f){hint=f;tipb.hidden=false}
tipb.onclick=()=>hint&&hint();
document.getElementById('x').onclick=home;
function done(){bar.style.width='100%';tipb.hidden=true;P.textContent='';stage.replaceChildren();
 const r=$('div','res');r.append($('h2',0,'Geschafft'),$('p',0,`${S.q.length} Aufgaben, ${S.err} Fehler`));
 const u=$('ul');W.forEach((w,k)=>u.append($('li','la',`${w.la} – ${w.de}: ${S.errW[k]} Fehler`)));
 const b=$('button','go','Nochmal');b.onclick=start;r.append(u,b);stage.append(r)}
const card=(m,s,lat)=>{const c=$('div','card');const b=$('b',lat?'la':'',m);c.append(b);if(s)c.append($('small',0,s));stage.append(c)};
// ---------- 1. Geste lernen ----------
function gest(T){const w=W[T.k];P.textContent='Lerne mit Gesten: Fahre die Linie mit dem Finger nach.';card(w.la,w.de,1);
 const NS='http://www.w3.org/2000/svg',mk=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e};
 const svg=mk('svg',{viewBox:'0 0 100 100',class:'pad'});const pl=g=>g.map(p=>p.join(',')).join(' ');
 const L={fill:'none','stroke-linecap':'round','stroke-linejoin':'round'};
 svg.append(mk('polyline',{...L,points:pl(w.g),stroke:'#aab2cc','stroke-width':9,opacity:.5}));
 const tr=mk('polyline',{...L,stroke:'#6b2a5c','stroke-width':6});svg.append(tr,mk('circle',{cx:w.g[0][0],cy:w.g[0][1],r:5,fill:'#6b2a5c'}));
 const sm=[];for(let i=1;i<w.g.length;i++){const a=w.g[i-1],b=w.g[i],n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/2);for(let s=0;s<=n;s++)sm.push([a[0]+(b[0]-a[0])*s/n,a[1]+(b[1]-a[1])*s/n,0])}
 let down=false,u=[],fin=false;
 const pos=e=>{const r=svg.getBoundingClientRect();return[(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]};
 const mark=p=>sm.forEach(s=>{if(Math.hypot(s[0]-p[0],s[1]-p[1])<11)s[2]=1});
 svg.onpointerdown=e=>{if(fin)return;down=true;svg.setPointerCapture(e.pointerId);u=[pos(e)];mark(u[0]);tr.setAttribute('points',pl(u))};
 svg.onpointermove=e=>{if(!down||fin)return;const p=pos(e),q=u[u.length-1],n=Math.ceil(Math.hypot(p[0]-q[0],p[1]-q[1])/3);
  for(let s=1;s<=n;s++)mark([q[0]+(p[0]-q[0])*s/n,q[1]+(p[1]-q[1])*s/n]);u.push(p);tr.setAttribute('points',pl(u));
  if(sm.filter(s=>s[2]).length/sm.length>=.92){fin=true;down=false;tr.setAttribute('stroke','#4f8a5b');ok(600)}};
 svg.onpointerup=svg.onpointercancel=()=>{if(fin||!down)return;down=false;u=[];sm.forEach(s=>s[2]=0);tr.setAttribute('points','')};
 stage.append(svg)}
// ---------- 2. Multiple Choice (Latein → Deutsch) ----------
function mc(T){P.textContent='Minitest: Wähle die richtige Übersetzung.';card(W[T.k].la,'',1);
 const o=$('div','opts');sh([T.k,...sh(IDX.filter(k=>k!==T.k)).slice(0,3)]).forEach(k=>{const b=$('button','opt',W[k].de);
  b.onclick=()=>{if(k===T.k){b.classList.add('ok');ok()}else{b.classList.add('bad');wobble(b);bad(T.k)}};o.append(b)});stage.append(o)}
// ---------- 3. Paare finden ----------
function pairs(){P.textContent='Minitest: Finde die passenden Paare.';const c=$('div','cols'),cl=$('div'),cr=$('div');let sel=null,left=IDX.length;
 const mk=(k,side)=>{const b=$('button','opt',side?W[k].de:W[k].la);if(!side)b.classList.add('la');
  b.onclick=()=>{if(!sel||sel.side===side){sel&&sel.b.classList.remove('sel');sel={k,side,b};b.classList.add('sel');return}
   if(sel.k===k){[sel.b,b].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.disabled=true});sel=null;if(!--left)ok(500)}
   else{bad(sel.k);[sel.b,b].forEach(x=>{x.classList.remove('sel');wobble(x)});sel=null}};return b};
 sh(IDX).forEach(k=>cl.append(mk(k,0)));sh(IDX).forEach(k=>cr.append(mk(k,1)));c.append(cl,cr);stage.append(c)}
// ---------- 4/5. Rechtschreibung (Wortteile oder Buchstaben) ----------
function spell(T){const w=W[T.k],parts=T.m?w.ch:Array.from(w.la);let pos=0;
 P.textContent=`Rechtschreibung: Wähle die ${T.m?'Wortteile':'Buchstaben'} in der richtigen Reihenfolge.`;card(w.de);
 const ans=$('div','ans la'),pool=$('div','pool');
 const upd=()=>ans.textContent=parts.slice(0,pos).join('')+' '+(T.m?'▬ ':'• ').repeat(parts.length-pos);upd();
 (T.m?sh(parts):sh([...new Set(parts)])).forEach(p=>{const b=$('button','tile la',p);
  b.onclick=()=>{pool.querySelectorAll('.tip').forEach(x=>x.classList.remove('tip'));
   if(p===parts[pos]){pos++;if(T.m)b.remove();upd();if(pos===parts.length){ans.classList.add('ok');ok()}}else{bad(T.k);wobble(b)}};pool.append(b)});
 setHint(()=>{const b=[...pool.children].find(x=>x.textContent===parts[pos]);b&&b.classList.add('tip')});stage.append(ans,pool)}
// ---------- 6. Raster nachfahren (Deutsch → Latein) ----------
function walk(len){for(;;){const used=new Set(),p=[];
 const go=(r,c)=>{p.push([r,c]);used.add(r*5+c);if(p.length===len)return true;
  for(const[d,e]of sh([[0,1],[1,0],[0,-1],[-1,0]])){const a=r+d,b=c+e;if(a>=0&&a<5&&b>=0&&b<5&&!used.has(a*5+b)&&go(a,b))return true}
  p.pop();used.delete(r*5+c);return false};
 if(go(Math.random()*5|0,Math.random()*5|0))return p}}
function grid(T){const w=W[T.k],ch=Array.from(w.la),path=walk(ch.length);
 P.textContent='Minitest: Fahre die lateinische Übersetzung im Raster nach.';card(w.de);
 const L=Array.from({length:25},()=>FILL[Math.random()*FILL.length|0]);path.forEach(([r,c],i)=>L[r*5+c]=ch[i]);
 const g=$('div','grid');const cells=L.map((x,i)=>{const d=$('div','la',x);d.dataset.i=i;g.append(d);return d});
 let seq=[],down=false;const adj=(a,b)=>Math.abs((a/5|0)-(b/5|0))+Math.abs(a%5-b%5)===1;
 const paint=()=>cells.forEach((c,i)=>c.classList.toggle('on',seq.includes(i)));
 const at=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.dataset.i!=null?+el.dataset.i:null};
 g.onpointerdown=e=>{const i=at(e);if(i==null)return;down=true;g.setPointerCapture(e.pointerId);seq=[i];paint()};
 g.onpointermove=e=>{if(!down)return;const i=at(e);if(i==null)return;const l=seq[seq.length-1];if(i===l)return;
  if(seq[seq.length-2]===i)seq.pop();else if(!seq.includes(i)&&adj(l,i))seq.push(i);paint()};
 g.onpointerup=()=>{if(!down)return;down=false;
  if(seq.map(i=>L[i]).join('')===w.la){cells.forEach((c,i)=>seq.includes(i)&&c.classList.add('ok'));ok(600)}
  else{if(seq.length>1)bad(T.k);wobble(g);seq=[];paint()}};
 setHint(()=>cells[path[0][0]*5+path[0][1]].classList.add('tip'));stage.append(g)}
home();
</script></body></html>
